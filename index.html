<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Daily Report Metering Digital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- CSS FORMAT CETAK 1 HALAMAN LANDSCAPE -->
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            body { 
                background: white !important; 
                font-size: 7.5pt !important; 
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            .print-shadow-none { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
            
            main { padding: 0 !important; space-y: 2 border: none !important; }
            table { font-size: 7pt !important; border-collapse: collapse !important; width: 100% !important; }
            th, td { padding: 1px 2px !important; line-height: 1.1 !important; border: 1px solid #94a3b8 !important; }
            input, select { border: none !important; background: transparent !important; padding: 0 !important; font-size: 7pt !important; text-align: center !important; }
            
            .sign-section {
                margin-top: 10px !important;
                padding-top: 4px !important;
                page-break-inside: avoid !important;
            }
            .sign-box { height: 35px !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSywiFtVDpIoyXAli3wN-ziw8w4LibauLCAfffsDwsykYXHuEzBqIA71BXnke4TEyhaA/exec";

        const INITIAL_USERS = [
            { username: "muammar", password: "123", name: "Muammar Ghadafi", role: "admin", station: "STA. MNCGROUP PALANGKA RAYA" },
            { username: "murjani", password: "123", name: "Murjani", role: "operator", station: "STA. MNCGROUP PALANGKA RAYA" },
            { username: "debak", password: "123", name: "Debak", role: "operator", station: "STA. MNCGROUP PALANGKA RAYA" }
        ];

        const TIME_SLOTS = ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];

        const createTransmitterParams = (prefix) => [
            { id: `${prefix}_pwr`, name: "Output Power TX", unit: "W", type: "number", warnMax: null },
            { id: `${prefix}_ref`, name: "Reflected Power TX", unit: "W", type: "number", warnMax: 5 },
            { id: `${prefix}_sq`, name: "Indovision/Kvision SQ", unit: "dB", type: "number", warnMax: null },
            { id: `${prefix}_ss`, name: "Indovision/Kvision SS", unit: "dB", type: "number", warnMax: null },
            { id: `${prefix}_cn`, name: "C/N", unit: "dB", type: "number", warnMax: null },
            { id: `${prefix}_rf`, name: "RF Level", unit: "dBm", type: "number", warnMax: null },
            { id: `${prefix}_ber`, name: "BER", unit: "Desimal", type: "ber_decimal", warnMax: null },
        ];

        const PARAMETERS = [
            { 
                category: "1. Power & Facility", 
                items: [
                    { id: "pln_kwh", name: "PLN Metering", unit: "kWh", type: "number", warnMax: null },
                    { id: "ups_load", name: "UPS Load", unit: "%", type: "number", warnMax: 80 },
                    { id: "genset_min", name: "Genset Working", unit: "Menit", type: "number", warnMax: null },
                    { id: "genset_solar", name: "Solar Genset", unit: "Liter", type: "number", warnMax: null },
                    { id: "ac_status", name: "Status AC", unit: "Status", type: "enum", options: ["OK", "NOT OK"] },
                    { id: "fo_status", name: "Status Fiber Optic", unit: "Status", type: "enum", options: ["OK", "NOT OK"] },
                ]
            },
            { category: "2. Transmitter RCTI", items: createTransmitterParams("rcti") },
            { category: "3. Transmitter MNCTV", items: createTransmitterParams("mnc") },
            { category: "4. Transmitter GTV", items: createTransmitterParams("gtv") },
            { category: "5. Transmitter iNews", items: createTransmitterParams("inews") },
            { 
                category: "6. Backup System", 
                items: [
                    { id: "backup_sq", name: "Parabola Backup SQ", unit: "%", type: "number", warnMax: null },
                    { id: "backup_ss", name: "Parabola Backup SS", unit: "%", type: "number", warnMax: null },
                ]
            }
        ];

        function App() {
            const [usersDB, setUsersDB] = useState(() => {
                const saved = localStorage.getItem("metering_users_db");
                return saved ? JSON.parse(saved) : INITIAL_USERS;
            });

            const [user, setUser] = useState(null);
            const [loginInput, setLoginInput] = useState({ username: "", password: "", remember: false });
            const [loginError, setLoginError] = useState("");

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [passForm, setPassForm] = useState({ oldPass: "", newPass: "", confirmPass: "" });
            const [passMsg, setPassMsg] = useState({ error: "", success: "" });

            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [pdfHistory, setPdfHistory] = useState([]);
            const [loadingHistory, setLoadingHistory] = useState(false);

            const [date, setDate] = useState("2026-09-04");
            const [status, setStatus] = useState("Draft");
            const [rejectReason, setRejectReason] = useState("");
            const [viewMode, setViewMode] = useState("matrix");
            const [selectedSlot, setSelectedSlot] = useState("08:00");
            const [driveLoading, setDriveLoading] = useState(false);
            const [autoSyncStatus, setAutoSyncStatus] = useState("");
            
            const [meteringData, setMeteringData] = useState({});
            const [operatorsBySlot, setOperatorsBySlot] = useState({});

            useEffect(() => {
                const savedSession = localStorage.getItem("metering_session");
                if (savedSession) setUser(JSON.parse(savedSession));
            }, []);

            useEffect(() => {
                localStorage.setItem("metering_users_db", JSON.stringify(usersDB));
            }, [usersDB]);

            useEffect(() => {
                if (user) fetchLatestDataFromDrive(date);
            }, [date, user]);

            const fetchLatestDataFromDrive = async (targetDate) => {
                setAutoSyncStatus("Memuat data...");
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "load", date: targetDate }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success" && result.data) {
                        setMeteringData(result.data.meteringData || {});
                        setOperatorsBySlot(result.data.operatorsBySlot || {});
                        setStatus(result.data.status || "Draft");
                        setRejectReason(result.data.rejectReason || "");
                        setAutoSyncStatus("Data tersinkronisasi");
                    } else {
                        setMeteringData({});
                        setOperatorsBySlot({});
                        setStatus("Draft");
                        setRejectReason("");
                        setAutoSyncStatus("Data baru (kosong)");
                    }
                } catch (err) {
                    setAutoSyncStatus("Gagal sinkronisasi");
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = usersDB.find(
                    u => u.username.toLowerCase() === loginInput.username.toLowerCase() && u.password === loginInput.password
                );

                if (foundUser) {
                    setUser(foundUser);
                    setLoginError("");
                    if (loginInput.remember) {
                        localStorage.setItem("metering_session", JSON.stringify(foundUser));
                    }
                } else {
                    setLoginError("Username atau password salah!");
                }
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem("metering_session");
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setPassMsg({ error: "", success: "" });

                if (passForm.oldPass !== user.password) {
                    setPassMsg({ error: "Password lama tidak sesuai!", success: "" });
                    return;
                }
                if (passForm.newPass.length < 3) {
                    setPassMsg({ error: "Password baru minimal 3 karakter!", success: "" });
                    return;
                }
                if (passForm.newPass !== passForm.confirmPass) {
                    setPassMsg({ error: "Konfirmasi password baru tidak cocok!", success: "" });
                    return;
                }

                const updatedDB = usersDB.map(u => 
                    u.username === user.username ? { ...u, password: passForm.newPass } : u
                );
                const updatedUser = { ...user, password: passForm.newPass };

                setUsersDB(updatedDB);
                setUser(updatedUser);
                if (localStorage.getItem("metering_session")) {
                    localStorage.setItem("metering_session", JSON.stringify(updatedUser));
                }

                setPassMsg({ error: "", success: "Password berhasil diperbarui!" });
                setTimeout(() => {
                    setShowChangePassModal(false);
                    setPassForm({ oldPass: "", newPass: "", confirmPass: "" });
                    setPassMsg({ error: "", success: "" });
                }, 1500);
            };

            const handleInputChange = async (paramId, timeSlot, value) => {
                if (status === "Approved" && user.role !== "admin") return;
                
                const updatedData = {
                    ...meteringData,
                    [paramId]: {
                        ...(meteringData[paramId] || {}),
                        [timeSlot]: value
                    }
                };

                const updatedOps = {
                    ...operatorsBySlot,
                    [timeSlot]: user.name
                };

                setMeteringData(updatedData);
                setOperatorsBySlot(updatedOps);

                try {
                    setAutoSyncStatus("Menyimpan...");
                    const payload = { date, status, rejectReason, meteringData: updatedData, operatorsBySlot: updatedOps, updatedBy: user.name };
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "save", date, payload }),
                        redirect: "follow"
                    });
                    setAutoSyncStatus("Data tersimpan otomatis");
                } catch(e) {
                    setAutoSyncStatus("Gagal autosave");
                }
            };

            const handleSubmitReport = async () => {
                setDriveLoading(true);
                const targetStatus = "Submitted";
                try {
                    const payload = { date, status: targetStatus, rejectReason: "", meteringData, operatorsBySlot, updatedBy: user.name };
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "save", date, payload }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        setStatus(targetStatus);
                        alert("Laporan berhasil disubmit!");
                    } else {
                        alert("Gagal submit: " + result.message);
                    }
                } catch (err) {
                    alert("Gagal terhubung ke Google Drive saat submit.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const handleUploadPdfToDrive = async () => {
                setDriveLoading(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ 
                            action: "upload_pdf", 
                            date, 
                            status, 
                            pdfFileName: `Laporan_Metering_${date}.pdf`,
                            meteringData, 
                            operatorsBySlot,
                            parameters: PARAMETERS 
                        }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        alert(result.message || "PDF berhasil diunggah!");
                    } else {
                        alert("Gagal upload PDF: " + result.message);
                    }
                } catch (err) {
                    alert("Gagal mengunggah PDF.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const handleExportExcelToDrive = async () => {
                setDriveLoading(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ 
                            action: "export_excel", 
                            date, 
                            status, 
                            meteringData, 
                            operatorsBySlot,
                            parameters: PARAMETERS 
                        }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        alert(result.message || "File Excel berhasil disimpan!");
                    } else {
                        alert("Gagal menyimpan Excel: " + result.message);
                    }
                } catch (err) {
                    alert("Gagal terhubung ke Google Drive.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const handleExportMonthlyExcel = async () => {
                const monthYear = date.substring(0, 7);
                setDriveLoading(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "export_monthly_excel", monthYear: monthYear, parameters: PARAMETERS }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        alert(result.message);
                    } else {
                        alert("Gagal rekap bulanan: " + result.message);
                    }
                } catch (err) {
                    alert("Gagal terhubung ke Google Drive.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const fetchPdfHistory = async () => {
                setShowHistoryModal(true);
                setLoadingHistory(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "get_pdf_list" }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        setPdfHistory(result.pdfs || []);
                    } else {
                        alert("Gagal mengambil riwayat file.");
                    }
                } catch (err) {
                    alert("Gagal terhubung ke Google Drive.");
                } finally {
                    setLoadingHistory(false);
                }
            };

            const sanitizeNumberInput = (val) => {
                let cleaned = val.replace(',', '.');
                cleaned = cleaned.replace(/[^0-9.-]/g, '');
                const parts = cleaned.split('.');
                if (parts.length > 2) {
                    cleaned = parts[0] + '.' + parts.slice(1).join('');
                }
                return cleaned;
            };

            const getFilledSlotsCount = () => {
                let filledSlots = 0;
                TIME_SLOTS.forEach(slot => {
                    const hasData = PARAMETERS.some(cat => 
                        cat.items.some(param => meteringData[param.id]?.[slot])
                    );
                    if (hasData) filledSlots++;
                });
                return filledSlots;
            };

            const countWarnings = () => {
                let count = 0;
                PARAMETERS.forEach(cat => {
                    cat.items.forEach(param => {
                        if (param.warnMax) {
                            TIME_SLOTS.forEach(slot => {
                                const val = parseFloat(meteringData[param.id]?.[slot]);
                                if (val && val > param.warnMax) count++;
                            });
                        }
                    });
                });
                return count;
            };

            if (!user) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-md border border-slate-700">
                            <div className="bg-blue-600 p-6 text-white text-center">
                                <div className="inline-block bg-white text-blue-600 font-black text-2xl px-3 py-1 rounded tracking-wider mb-2">MNC</div>
                                <h1 className="text-xl font-bold">Daily Report Metering</h1>
                                <p className="text-xs text-blue-100 mt-1">STA. MNCGROUP PALANGKA RAYA</p>
                            </div>

                            <form onSubmit={handleLogin} className="p-6 space-y-4">
                                {loginError && (
                                    <div className="bg-red-50 border-l-4 border-red-500 p-3 text-red-700 text-xs rounded">
                                        {loginError}
                                    </div>
                                )}

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={loginInput.username}
                                        onChange={e => setLoginInput({...loginInput, username: e.target.value})}
                                        className="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        placeholder="Masukkan username"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={loginInput.password}
                                        onChange={e => setLoginInput({...loginInput, password: e.target.value})}
                                        className="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        placeholder="Masukkan password"
                                    />
                                </div>

                                <div className="flex items-center justify-between text-xs">
                                    <label className="flex items-center text-slate-600 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={loginInput.remember}
                                            onChange={e => setLoginInput({...loginInput, remember: e.target.checked})}
                                            className="mr-2 rounded text-blue-600" 
                                        />
                                        Remember Me
                                    </label>
                                </div>

                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">
                                    Masuk ke Sistem
                                </button>

                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 mt-4 text-[11px] text-slate-600 space-y-1">
                                    <p className="font-bold text-slate-800">Akun Pengguna Default (Password: 123):</p>
                                    <p>• Admin & Spv: <code className="bg-slate-200 px-1 rounded">muammar</code> (Muammar Ghadafi)</p>
                                    <p>• Operator 1: <code className="bg-slate-200 px-1 rounded">murjani</code> (Murjani)</p>
                                    <p>• Operator 2: <code className="bg-slate-200 px-1 rounded">debak</code> (Debak)</p>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 font-black text-xl px-2.5 py-1 rounded tracking-wider">MNC</div>
                                <div>
                                    <h1 className="font-bold text-base leading-tight">Daily Report Metering Digital</h1>
                                    <p className="text-xs text-slate-400">{user.station}</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3 text-sm">
                                <span className="text-[11px] bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700 font-medium">
                                    🔄 {autoSyncStatus || "Siap"}
                                </span>
                                <button 
                                    onClick={() => setViewMode(viewMode === "matrix" ? "mobile" : "matrix")} 
                                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                                >
                                    Mode: {viewMode === "matrix" ? "🖥️ Matrix" : "📱 Accordion"}
                                </button>
                                <div className="text-right border-l border-slate-700 pl-3 hidden sm:block">
                                    <p className="font-bold text-xs">{user.name}</p>
                                    <span className="bg-blue-500/20 text-blue-300 text-[10px] font-bold uppercase px-1.5 py-0.5 rounded border border-blue-500/30">
                                        {user.role === 'admin' ? 'Supervisor / Admin' : 'Operator'}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setShowChangePassModal(true)}
                                    className="bg-amber-600/20 text-amber-300 hover:bg-amber-600 hover:text-white border border-amber-500/30 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition"
                                    title="Ubah Password"
                                >
                                    🔑 Ubah Pass
                                </button>
                                <button 
                                    onClick={handleLogout}
                                    className="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition"
                                >
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
                        
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 print-shadow-none">
                            <div className="space-y-1">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Stasiun</span>
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                                        status === "Approved" ? "bg-emerald-100 text-emerald-800" :
                                        status === "Submitted" ? "bg-blue-100 text-blue-800" :
                                        status === "Rejected" ? "bg-red-100 text-red-800" : "bg-amber-100 text-amber-800"
                                    }`}>
                                        STATUS: {status.toUpperCase()}
                                    </span>
                                </div>
                                <h2 className="text-xl font-bold text-slate-900">{user.station}</h2>
                                <p className="text-xs text-slate-500">
                                    Operator Saat Ini: <span className="font-semibold text-slate-700">{user.name}</span> | Tanggal: <input type="date" value={date} onChange={e => setDate(e.target.value)} className="font-semibold text-slate-700 border-b no-print" /> <span className="hidden print:inline font-semibold">{date}</span>
                                </p>
                            </div>

                            <div className="flex flex-wrap gap-2 no-print">
                                {user.role === "admin" && (
                                    <>
                                        <button 
                                            onClick={handleUploadPdfToDrive} 
                                            disabled={driveLoading}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50"
                                        >
                                            📄 {driveLoading ? "Proses..." : "Upload PDF ke Drive"}
                                        </button>

                                        <button 
                                            onClick={handleExportExcelToDrive} 
                                            disabled={driveLoading}
                                            className="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50"
                                        >
                                            📊 {driveLoading ? "Proses..." : "Save Excel Drive"}
                                        </button>

                                        <button 
                                            onClick={handleExportMonthlyExcel} 
                                            disabled={driveLoading}
                                            className="bg-lime-600 hover:bg-lime-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50"
                                            title="Merekap seluruh file 30 hari bulan ini ke dalam Excel"
                                        >
                                            📊 {driveLoading ? "Proses..." : "Rekap Bulanan Excel"}
                                        </button>

                                        <button 
                                            onClick={fetchPdfHistory} 
                                            className="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1"
                                        >
                                            📂 Riwayat File Drive
                                        </button>

                                        <button 
                                            onClick={() => fetchLatestDataFromDrive(date)} 
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1"
                                        >
                                            🔄 Refresh Data
                                        </button>
                                    </>
                                )}

                                {(status === "Draft" || status === "Rejected") && (
                                    <button 
                                        onClick={handleSubmitReport}
                                        disabled={driveLoading}
                                        className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50"
                                    >
                                        🚀 {driveLoading ? "Proses..." : "Submit Laporan"}
                                    </button>
                                )}

                                {(user.role === "admin" || user.role === "supervisor") && (
                                    <>
                                        {status !== "Approved" && (
                                            <button onClick={() => setStatus("Approved")} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
                                                Approve (Supervisor)
                                            </button>
                                        )}
                                        {status !== "Rejected" && (
                                            <button onClick={() => {
                                                const reason = prompt("Masukkan alasan penolakan:");
                                                if (reason) { setRejectReason(reason); setStatus("Rejected"); }
                                            }} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
                                                Reject (Supervisor)
                                            </button>
                                        )}
                                    </>
                                )}

                                {status === "Rejected" && (user.role === "operator" || user.role === "admin") && (
                                    <button onClick={() => setStatus("Draft")} className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
                                        Edit Laporan
                                    </button>
                                )}

                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
                                    🖨️ Cetak PDF (1 Halaman)
                                </button>
                            </div>
                        </div>

                        {status === "Rejected" && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
                                <p className="text-xs font-bold text-red-800 uppercase">Catatan Penolakan Supervisor:</p>
                                <p className="text-sm text-red-700 mt-1">{rejectReason || "Mohon periksa kembali input data yang tidak wajar."}</p>
                            </div>
                        )}

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 no-print">
                            <div className="bg-white p-4 rounded-xl border border-slate-200">
                                <p className="text-xs font-semibold text-slate-500 uppercase">Progres Input</p>
                                <p className="text-2xl font-black text-slate-900 mt-1">{getFilledSlotsCount()} <span className="text-xs font-normal text-slate-500">/ 12 Slot</span></p>
                                <div className="w-full bg-slate-100 rounded-full h-1.5 mt-2">
                                    <div className="bg-blue-600 h-1.5 rounded-full transition-all" style={{width: `${(getFilledSlotsCount()/12)*100}%`}}></div>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200">
                                <p className="text-xs font-semibold text-slate-500 uppercase">Warning System</p>
                                <p className={`text-2xl font-black mt-1 ${countWarnings() > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>
                                    {countWarnings()} <span className="text-xs font-normal text-slate-500">Peringatan</span>
                                </p>
                                <p className="text-xs text-slate-400 mt-1">{countWarnings() > 0 ? "Nilai melebihi batas normal" : "Kondisi Aman"}</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200">
                                <p className="text-xs font-semibold text-slate-500 uppercase">Fasilitas</p>
                                <p className="text-2xl font-black text-emerald-600 mt-1">OK</p>
                                <p className="text-xs text-slate-400 mt-1">AC & Fiber Optic Normal</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200">
                                <p className="text-xs font-semibold text-slate-500 uppercase">Status Approval</p>
                                <p className="text-sm font-bold text-slate-800 mt-2">{status}</p>
                                <p className="text-xs text-slate-400 mt-0.5">{status === "Approved" ? "Data Terkunci" : "Dapat Diisi"}</p>
                            </div>
                        </div>

                        {/* TABEL MATRIX INPUT */}
                        {(viewMode === "matrix" || window.matchMedia('print').matches) && (
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center no-print">
                                    <h3 className="font-bold text-slate-800 text-sm">Tabel Matrix Daily Report Metering (All Channels)</h3>
                                    <span className="text-xs text-slate-500">Baris teratas menunjukkan nama penginput masing-masing slot jam</span>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-700 uppercase border-b border-slate-200">
                                                <th className="p-2 font-bold min-w-[180px] sticky left-0 bg-slate-100 z-10 border-r">Parameter</th>
                                                <th className="p-2 font-bold text-center w-12 border-r">Satuan</th>
                                                {TIME_SLOTS.map(slot => (
                                                    <th key={slot} className="p-1.5 font-bold text-center border-r">{slot}</th>
                                                ))}
                                            </tr>
                                            {/* BARIS PENGINPUT PER SLOT */}
                                            <tr className="bg-blue-50 text-blue-900 font-semibold border-b border-slate-200 text-[10px]">
                                                <td className="p-1 px-2 sticky left-0 bg-blue-50 border-r">Penginput On Duty</td>
                                                <td className="p-1 text-center border-r">-</td>
                                                {TIME_SLOTS.map(slot => (
                                                    <td key={slot} className="p-1 text-center border-r truncate max-w-[70px]" title={operatorsBySlot[slot] || "-"}>
                                                        {operatorsBySlot[slot] ? operatorsBySlot[slot].split(' ')[0] : "-"}
                                                    </td>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {PARAMETERS.map((cat, idx) => (
                                                <React.Fragment key={idx}>
                                                    <tr className="bg-slate-200/80 font-bold text-slate-900 uppercase">
                                                        <td colSpan={14} className="p-1 px-2">{cat.category}</td>
                                                    </tr>
                                                    {cat.items.map(param => (
                                                        <tr key={param.id} className="hover:bg-slate-50">
                                                            <td className="p-1.5 font-medium sticky left-0 bg-white border-r shadow-[2px_0_5px_rgba(0,0,0,0.02)]">
                                                                {param.name}
                                                            </td>
                                                            <td className="p-1.5 text-center text-slate-400 border-r">{param.unit}</td>
                                                            {TIME_SLOTS.map(slot => {
                                                                const val = meteringData[param.id]?.[slot] || "";
                                                                const isWarn = param.warnMax && parseFloat(val) > param.warnMax;
                                                                const isDisabled = status === "Approved" && user.role !== "admin";
                                                                
                                                                if (param.type === "enum") {
                                                                    return (
                                                                        <td key={slot} className="p-0.5 border-r text-center">
                                                                            <select 
                                                                                value={val} 
                                                                                disabled={isDisabled}
                                                                                onChange={e => handleInputChange(param.id, slot, e.target.value)}
                                                                                className="w-full p-0.5 text-center bg-transparent focus:outline-none font-semibold"
                                                                            >
                                                                                <option value="">-</option>
                                                                                {param.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                                            </select>
                                                                        </td>
                                                                    );
                                                                }

                                                                return (
                                                                    <td key={slot} className={`p-0.5 border-r text-center ${isWarn ? "bg-amber-100" : ""}`}>
                                                                        <input 
                                                                            type="text"
                                                                            inputMode="decimal"
                                                                            value={val}
                                                                            disabled={isDisabled}
                                                                            placeholder="-"
                                                                            onChange={e => handleInputChange(param.id, slot, sanitizeNumberInput(e.target.value))}
                                                                            className={`w-full p-0.5 text-center bg-transparent focus:outline-none ${isWarn ? "font-bold text-amber-900" : ""}`}
                                                                        />
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ACCORDION VIEW HP */}
                        {viewMode === "mobile" && (
                            <div className="space-y-4 no-print">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 uppercase">Pilih Jam Input:</label>
                                        <p className="text-[10px] text-blue-600 font-bold mt-0.5">
                                            Penginput Slot {selectedSlot}: {operatorsBySlot[selectedSlot] || "Belum diisi"}
                                        </p>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {TIME_SLOTS.map(slot => (
                                            <button 
                                                key={slot}
                                                onClick={() => setSelectedSlot(slot)}
                                                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${
                                                    selectedSlot === slot ? "bg-blue-600 text-white shadow-sm" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                                                }`}
                                            >
                                                {slot}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {PARAMETERS.map((cat, idx) => (
                                    <div key={idx} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-800 text-white px-4 py-2.5 font-bold text-xs uppercase tracking-wider">
                                            {cat.category}
                                        </div>
                                        <div className="p-4 divide-y divide-slate-100">
                                            {cat.items.map(param => {
                                                const val = meteringData[param.id]?.[selectedSlot] || "";
                                                const isWarn = param.warnMax && parseFloat(val) > param.warnMax;
                                                const isDisabled = status === "Approved" && user.role !== "admin";
                                                return (
                                                    <div key={param.id} className="py-2.5 flex items-center justify-between gap-4">
                                                        <div>
                                                            <p className="text-xs font-semibold text-slate-800">{param.name}</p>
                                                            <span className="text-[10px] text-slate-400">Satuan: {param.unit}</span>
                                                        </div>
                                                        <div className="w-36">
                                                            {param.type === "enum" ? (
                                                                <select 
                                                                    value={val} 
                                                                    disabled={isDisabled}
                                                                    onChange={e => handleInputChange(param.id, selectedSlot, e.target.value)}
                                                                    className="w-full p-2 text-xs border rounded-lg bg-slate-50 font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                                                >
                                                                    <option value="">- Pilih -</option>
                                                                    {param.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                                </select>
                                                            ) : (
                                                                <input 
                                                                    type="text"
                                                                    inputMode="decimal"
                                                                    value={val}
                                                                    disabled={isDisabled}
                                                                    placeholder="0"
                                                                    onChange={e => handleInputChange(param.id, selectedSlot, sanitizeNumberInput(e.target.value))}
                                                                    className={`w-full p-2 text-xs border rounded-lg text-center bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none ${
                                                                        isWarn ? "bg-amber-100 font-bold text-amber-900 border-amber-300" : ""
                                                                    }`}
                                                                />
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TANDA TANGAN PRINT */}
                        <div className="hidden print:grid grid-cols-3 gap-4 text-center sign-section text-xs">
                            <div>
                                <p className="font-semibold text-slate-600">Dibuat Oleh Operator,</p>
                                <div className="sign-box"></div>
                                <p className="font-bold text-slate-900 underline">( Shift Operator )</p>
                            </div>
                            <div>
                                <p className="font-semibold text-slate-600">Diperiksa & Disetujui Oleh,</p>
                                <div className="sign-box"></div>
                                <p className="font-bold text-slate-900 underline">( Muammar Ghadafi )</p>
                                <p className="text-[10px] text-slate-500">Supervisor / Admin Station</p>
                            </div>
                            <div>
                                <p className="font-semibold text-slate-600">Chief Engineer,</p>
                                <div className="sign-box"></div>
                                <p className="font-bold text-slate-900 underline">( Manager On Duty )</p>
                            </div>
                        </div>

                    </main>

                    {/* MODAL RIWAYAT */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-200">
                                <div className="bg-purple-900 text-white p-4 flex justify-between items-center">
                                    <h3 className="font-bold text-sm flex items-center gap-2">📂 Riwayat File Tersimpan di Drive</h3>
                                    <button onClick={() => setShowHistoryModal(false)} className="text-slate-300 hover:text-white font-bold">✕</button>
                                </div>
                                <div className="p-5 space-y-3 max-h-96 overflow-y-auto">
                                    {loadingHistory ? (
                                        <div className="text-center py-8 text-slate-500 text-xs">Mengambil daftar file dari Google Drive...</div>
                                    ) : pdfHistory.length === 0 ? (
                                        <div className="text-center py-8 text-slate-500 text-xs">Belum ada file rekap tersimpan di Drive.</div>
                                    ) : (
                                        <div className="divide-y divide-slate-100">
                                            {pdfHistory.map((pdf, index) => (
                                                <div key={index} className="py-2.5 flex items-center justify-between hover:bg-slate-50 px-2 rounded-lg">
                                                    <div className="truncate mr-3">
                                                        <p className="text-xs font-bold text-slate-800 truncate">{pdf.name}</p>
                                                        <p className="text-[10px] text-slate-400">Dibuat pada: {pdf.dateCreated}</p>
                                                    </div>
                                                    <a 
                                                        href={pdf.url} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer"
                                                        className="bg-purple-100 hover:bg-purple-200 text-purple-800 text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 shrink-0 transition"
                                                    >
                                                        🔗 Buka File
                                                    </a>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="bg-slate-50 p-3 text-right border-t border-slate-100">
                                    <button 
                                        onClick={() => setShowHistoryModal(false)}
                                        className="px-4 py-1.5 text-xs font-semibold text-slate-600 bg-slate-200 rounded-lg hover:bg-slate-300"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL UBAH PASSWORD */}
                    {showChangePassModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-200">
                                <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                                    <h3 className="font-bold text-sm">🔑 Ubah Password Akun</h3>
                                    <button onClick={() => setShowChangePassModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>
                                <form onSubmit={handleChangePassword} className="p-5 space-y-3">
                                    {passMsg.error && <div className="bg-red-50 text-red-600 text-xs p-2 rounded border border-red-200">{passMsg.error}</div>}
                                    {passMsg.success && <div className="bg-emerald-50 text-emerald-600 text-xs p-2 rounded border border-emerald-200">{passMsg.success}</div>}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Password Lama</label>
                                        <input 
                                            type="password" 
                                            required
                                            value={passForm.oldPass}
                                            onChange={e => setPassForm({...passForm, oldPass: e.target.value})}
                                            className="w-full p-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Password Baru</label>
                                        <input 
                                            type="password" 
                                            required
                                            value={passForm.newPass}
                                            onChange={e => setPassForm({...passForm, newPass: e.target.value})}
                                            className="w-full p-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Konfirmasi Password Baru</label>
                                        <input 
                                            type="password" 
                                            required
                                            value={passForm.confirmPass}
                                            onChange={e => setPassForm({...passForm, confirmPass: e.target.value})}
                                            className="w-full p-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowChangePassModal(false)}
                                            className="px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm"
                                        >
                                            Simpan Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
